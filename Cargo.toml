[package]
name = "agentctx"
version = "0.1.0"
edition = "2024"
description = "A local-first context compiler for coding agents"
license = "MIT"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.39", features = ["bundled"] }
thiserror = "2.0"
tempfile = "3.20"
toml = "0.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
